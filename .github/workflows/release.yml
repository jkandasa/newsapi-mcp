name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            make build-all VERSION=${{ github.ref_name }}
          else
            make build-all VERSION=devel
          fi

      # devel: only delete once the build succeeds — leaves the old release intact on failure
      - name: Delete existing devel release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete devel --yes --cleanup-tag 2>/dev/null || true

      - name: Publish devel release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create devel dist/* \
            --title "devel" \
            --notes "Latest build from the main branch. Updated on every commit." \
            --prerelease \
            --latest=false \
            --target ${{ github.sha }}

      # versioned release: created once per tag, auto-generates notes from commits
      - name: Publish versioned release
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --latest
